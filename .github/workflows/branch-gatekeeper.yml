name: Branch Gatekeeper

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validar Reglas de Ramas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Validar origen del Pull Request
        if: github.event_name == 'pull_request'
        env:
          PR_SOURCE_BRANCH: ${{ github.head_ref }}
          PR_TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          echo "Verificando reglas de ramas del Pull Request..."
          echo "Rama origen: $PR_SOURCE_BRANCH"
          echo "Rama destino: $PR_TARGET_BRANCH"

          case "$PR_TARGET_BRANCH" in
            dev)
              if [ -z "$PR_SOURCE_BRANCH" ] || [ "$PR_SOURCE_BRANCH" = "dev" ]; then
                echo "::error::Los Pull Requests hacia 'dev' deben originarse en una rama secundaria."
                exit 1
              fi
              ;;
            main)
              if [ "$PR_SOURCE_BRANCH" != "dev" ]; then
                echo "::error::Los Pull Requests hacia 'main' solo pueden originarse en la rama 'dev'."
                exit 1
              fi
              ;;
            *)
              echo "::error::Rama destino no contemplada: '$PR_TARGET_BRANCH'."
              exit 1
              ;;
          esac

          echo "Validación de PR exitosa."

      - name: Validar origen del Push/Merge
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "Verificando procedencia del commit en '$TARGET_BRANCH'..."
          PR_SOURCE=""
          for i in {1..10}; do
            echo "Intento $i: Consultando PRs asociados al commit $COMMIT_SHA..."
            PR_SOURCE=$(gh api "repos/$REPOSITORY/commits/$COMMIT_SHA/pulls" --jq ".[] | select(.base.ref == \"$TARGET_BRANCH\") | .head.ref" 2>/dev/null | head -n 1 || true)
            if [ -n "$PR_SOURCE" ]; then
              break
            fi
            echo "La API de GitHub no devolvió un PR asociado aún. Esperando 3 segundos..."
            sleep 3
          done
          
          echo "Rama origen detectada: '$PR_SOURCE'"

          case "$TARGET_BRANCH" in
            dev)
              if [ -z "$PR_SOURCE" ] || [ "$PR_SOURCE" = "dev" ]; then
                echo "::error::Se detectó un push directo o un merge en 'dev' que no proviene de una rama secundaria."
                exit 1
              fi
              ;;
            main)
              if [ "$PR_SOURCE" != "dev" ]; then
                echo "::error::Se detectó un push directo o un merge en 'main' que no proviene de la rama 'dev'."
                exit 1
              fi
              ;;
            *)
              echo "::error::Rama destino no contemplada: '$TARGET_BRANCH'."
              exit 1
              ;;
          esac

          echo "Validación de Push/Merge exitosa."
